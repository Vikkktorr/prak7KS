              - img "Downloads" [ref=f41e434]
            - link [ref=f41e435] [cursor=pointer]:
              - /url: ""
              - img "License" [ref=f41e436]
            - link [ref=f41e437] [cursor=pointer]:
              - /url: https://snyk.io/test/github/grafana/grafana-polystat-panel
              - img "Known Vulnerabilities" [ref=f41e438]
            - link [ref=f41e446] [cursor=pointer]:
              - /url: https://codeclimate.com/github/grafana/grafana-polystat-panel/maintainability
              - img "Maintainability" [ref=f41e447]
            - link [ref=f41e448] [cursor=pointer]:
              - /url: https://codeclimate.com/github/grafana/grafana-polystat-panel/test_coverage
              - img "Test Coverage" [ref=f41e449]
          - paragraph [ref=f41e305]:
            - text: The Polystat panel plugin provides a
            - link "D3-based" [ref=f41e306] [cursor=pointer]:
              - /url: http://www.d3js.org
            - text: multi-stat panel for
            - link "Grafana" [ref=f41e307] [cursor=pointer]:
              - /url: https://grafana.com/
            - text: 9.5 or later.
          - paragraph [ref=f41e308]: This plugin creates an hexagon for each metric received, and allows you to group metrics into a composite metric and display the triggered state of the composite. The plugin supports autoscaling for best-fit sizing of each polygon to the panel size. When the complete text cannot be displayed, only tooltips are active.
          - paragraph [ref=f41e309]: "See the following examples:"
          - paragraph [ref=f41e310]:
            - strong [ref=f41e311]: All visible
          - paragraph [ref=f41e312]:
            - img "polystat-v2-agent-all-visible" [ref=f41e439]
          - paragraph [ref=f41e313]:
            - strong [ref=f41e314]: Scaled down
          - paragraph [ref=f41e315]:
            - img "polystat-v2-agent-scaled-down" [ref=f41e440]
          - paragraph [ref=f41e316]:
            - strong [ref=f41e317]: Scaled down with tooltip
          - paragraph [ref=f41e318]:
            - img "polystat-v2-agent-scaled-down-tooltip" [ref=f41e441]
          - heading "Settings and options" [level=2] [ref=f41e319]
          - paragraph [ref=f41e320]:
            - text: This panel provides a large number of settings customization options, and are searchable from the menu. For more info, see
            - link "General settings" [ref=f41e321] [cursor=pointer]:
              - /url: ""
            - text: and
            - link "Options" [ref=f41e322] [cursor=pointer]:
              - /url: ""
            - text: .
          - heading "Clickthrough URLs" [level=3] [ref=f41e323]
          - paragraph [ref=f41e324]:
            - text: Use this setting to indicate the URL to open when clicking the polygon. Find more information in
            - link "Use Clickthrough URLs" [ref=f41e325] [cursor=pointer]:
              - /url: ""
            - text: .
          - heading "Set thresholds" [level=2] [ref=f41e326]
          - paragraph [ref=f41e327]:
            - text: This plugin supports "ranged" states. See how to
            - link "Set thresholds" [ref=f41e328] [cursor=pointer]:
              - /url: ""
            - text: .
          - heading "Overrides" [level=2] [ref=f41e329]
          - paragraph [ref=f41e330]:
            - text: Use overrides to apply additional rendering options for metrics, including custom thresholds and clickthroughs.
            - link "Learn more" [ref=f41e331] [cursor=pointer]:
              - /url: ""
            - text: .
          - heading "Composites" [level=2] [ref=f41e332]
          - paragraph [ref=f41e333]:
            - text: Composites allow you to combine multiple metrics into a single representation that reflects the "worst" state of the metrics combined. See how at
            - link "Composites" [ref=f41e334] [cursor=pointer]:
              - /url: ""
            - text: .
          - heading "Value mappings" [level=2] [ref=f41e335]
          - paragraph [ref=f41e336]:
            - text: This is a built-in option in Grafana and behaves as documented in
            - link "Configure value mappings" [ref=f41e337] [cursor=pointer]:
              - /url: https://grafana.com/docs/grafana/latest/panels/configure-value-mappings/
            - text: .
          - paragraph [ref=f41e338]: Note that color assignments are ignored, and only threshold colors are applied.
          - heading "Build the plugin" [level=2] [ref=f41e339]
          - paragraph [ref=f41e340]:
            - text: This plugin relies on the
            - link "Plugin Tools" [ref=f41e341] [cursor=pointer]:
              - /url: https://github.com/grafana/plugin-tools
            - text: "typical build sequence:"
          - code [ref=f41e343]: yarn install yarn build
          - paragraph [ref=f41e344]: The code is parsed and copied into "dist" if "tslint" passes without errors.
          - paragraph [ref=f41e345]: "For development, you can run:"
          - code [ref=f41e347]: yarn dev
          - heading "Docker Support" [level=3] [ref=f41e348]
          - paragraph [ref=f41e349]:
            - text: The plugin includes a
            - code [ref=f41e350]: docker-compose.yml
            - text: file for development and testing.
          - paragraph [ref=f41e351]: "To use it run:"
          - code [ref=f41e353]: docker-compose up
          - paragraph [ref=f41e354]:
            - text: Then browse to
            - link "http://localhost:3000" [ref=f41e355] [cursor=pointer]:
              - /url: http://localhost:3000
          - heading "Enable Grafana TestData" [level=2] [ref=f41e356]
          - paragraph [ref=f41e357]:
            - code [ref=f41e358]: Grafana TestData
            - text: is not enabled by default.
          - paragraph [ref=f41e359]:
            - text: To enable it, navigate to the Plugins section in your Grafana main menu. Click the Apps tabs in the Plugins section and select the Grafana TestData App. Alternatively navigate directly to
            - link "http://your_grafana_instance/plugins/testdata/edit" [ref=f41e360] [cursor=pointer]:
              - /url: http://your_grafana_instance/plugins/testdata/edit
            - text: . Finally click the enable button to enable.
          - heading "Acknowledgements" [level=2] [ref=f41e361]
          - paragraph [ref=f41e362]: "This panel is based on this D3 example:"
          - list [ref=f41e363]:
